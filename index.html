<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Hub</title>
<meta name="theme-color" content="#080a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="App Hub">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23818cf8'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Cg fill='%230a0c16'%3E%3Crect x='24' y='24' width='22' height='22' rx='6'/%3E%3Crect x='54' y='24' width='22' height='22' rx='6'/%3E%3Crect x='24' y='54' width='22' height='22' rx='6'/%3E%3Crect x='54' y='54' width='22' height='22' rx='6'/%3E%3C/g%3E%3C/svg%3E">
<style>
@property --ang{ syntax:'<angle>'; initial-value:200deg; inherits:false }

:root{
  --bg:#080a14;
  --card:#0d1020;
  --text:#f2f4ff;
  --muted:#98a1c4;
  --dim:#7b84a8;
  --line:rgba(255,255,255,.12);
  --indigo:#818cf8;
  --cyan:#22d3ee;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.65; -webkit-text-size-adjust:100%;
  background-image:
    radial-gradient(900px 520px at 10% -8%, rgba(99,102,241,.34), transparent 62%),
    radial-gradient(780px 470px at 95% 6%, rgba(20,184,166,.22), transparent 64%),
    radial-gradient(700px 520px at 55% 112%, rgba(168,85,247,.16), transparent 62%);
  background-attachment:fixed;
}
a{text-decoration:none;color:inherit;display:block}
.wrap{max-width:1020px;margin:0 auto;padding:32px 20px 72px}

/* ---------- ヘッダー ---------- */
header{margin-bottom:26px}
.brand{
  position:relative;display:inline-flex;align-items:center;gap:15px;
  padding:14px 26px 14px 14px;border-radius:20px;
  background:rgba(13,16,32,.72);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 12px 34px rgba(3,5,18,.5);
}
.brand::before{
  content:"";position:absolute;inset:0;border-radius:20px;padding:1.4px;pointer-events:none;
  background:conic-gradient(from var(--ang), #6366f1, #22d3ee, #a855f7, #6366f1);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite:exclude;
  opacity:.6;
}
.mark{
  width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,var(--indigo),var(--cyan));
  box-shadow:0 10px 28px rgba(99,102,241,.42);
}
.mark span{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.mark i{width:8px;height:8px;border-radius:2px;background:var(--bg);display:block;opacity:.92}
h1{
  font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em;
  background:linear-gradient(100deg,#ffffff 18%,#a5b4fc 58%,#5eead4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{color:var(--dim);font-size:13px}

/* ---------- 絞り込み・検索 ---------- */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  font:inherit;font-size:13px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:#cfd5ee;
  border-radius:999px;padding:8px 16px;min-height:38px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:border-color .16s,color .16s,background .16s;
}
.chip:hover{border-color:rgba(165,180,252,.6);color:#fff}
.chip.on{background:linear-gradient(120deg,#6366f1,#22d3ee);border-color:transparent;color:#08101c;font-weight:700}
.chip:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.search{flex:1 1 220px;min-width:190px}
.search input{
  width:100%;font:inherit;font-size:16px;color:var(--text);
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.search input::placeholder{color:#6d7699}
.search input:focus{outline:none;border-color:rgba(165,180,252,.7);box-shadow:0 0 0 4px rgba(99,102,241,.18)}

/* ---------- カード ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:16px}

/* カードは「光の層」と「面」の2枚重ね。
   光は面の下に敷くので、内側には回り込まない */
.card{
  position:relative;border-radius:var(--radius);
  transition:transform .18s cubic-bezier(.2,.7,.3,1);
}
.glow{
  position:absolute;inset:-8px;border-radius:calc(var(--radius) + 8px);
  background:conic-gradient(from var(--ang), #6366f1, #22d3ee, #a855f7, #6366f1);
  filter:blur(18px);
  opacity:0;pointer-events:none;
  transition:opacity .22s;
}
.face{
  position:relative;display:block;border-radius:var(--radius);padding:19px;
  background:var(--card);
  box-shadow:0 10px 30px rgba(3,5,18,.55);
  transition:background .18s,box-shadow .18s;
}
/* 枠：conic-gradient を1.4pxのリングとして描く */
.face::before{
  content:"";position:absolute;inset:0;border-radius:var(--radius);padding:1.4px;pointer-events:none;
  background:conic-gradient(from var(--ang), #6366f1, #22d3ee, #a855f7, #6366f1);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite:exclude;
  opacity:.55;
  transition:opacity .18s;
}
.card:hover,.card:focus-visible{transform:translateY(-4px)}
.card:hover .glow,.card:focus-visible .glow{opacity:.75;animation:turn 5s linear infinite}
.card:hover .face,.card:focus-visible .face{background:#10132a;box-shadow:0 20px 46px rgba(3,5,18,.8)}
.card:hover .face::before,.card:focus-visible .face::before{opacity:1;animation:turn 5s linear infinite}
.card:focus-visible{outline:2px solid var(--indigo);outline-offset:5px}
@keyframes turn{ to{ --ang:560deg } }

.inner{display:flex;gap:14px;align-items:flex-start}
.ico{
  width:50px;height:50px;flex:none;border-radius:15px;display:grid;place-items:center;
  font-size:24px;line-height:1;
  background:linear-gradient(150deg,rgba(129,140,248,.30),rgba(34,211,238,.14));
  border:1px solid rgba(255,255,255,.13);
}
.cbody{min-width:0;display:block}
.name{display:block;margin:0 0 4px;font-size:16.5px;font-weight:700;color:var(--text);padding-right:24px}
.desc{display:block;margin:0 0 11px;font-size:13px;color:var(--muted);line-height:1.6}
.tag{
  display:inline-block;font-size:11px;padding:3px 11px;border-radius:999px;
  background:rgba(129,140,248,.15);color:#b6c0ff;border:1px solid rgba(129,140,248,.30);
}
.go{position:absolute;top:17px;right:17px;color:#5f6893;font-size:14px;transition:color .16s,transform .16s}
.card:hover .go{color:#a5b4fc;transform:translate(2px,-2px)}

.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:52px 12px;font-size:14px}

footer{
  margin-top:38px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);
  color:var(--dim);font-size:12px;line-height:1.85;
}
code{background:rgba(255,255,255,.07);border-radius:5px;padding:1px 7px;font-size:12px;color:#c3caf0}

@media (max-width:560px){
  .wrap{padding:24px 15px 60px}
  h1{font-size:22px}
  .brand{padding:12px 16px 12px 12px;gap:12px;border-radius:18px}
  .brand::before{border-radius:18px}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
  .card:hover{transform:none}
  .card:hover .glow{opacity:.6}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="mark"><span><i></i><i></i><i></i><i></i></span></div>
      <div>
        <h1>App Hub</h1>
        <div class="sub">自作アプリの入口。カードを押すとそのアプリが開きます</div>
      </div>
    </div>
  </header>

  <div class="bar">
    <div class="chips" id="chips"></div>
    <div class="search"><input id="q" type="search" placeholder="アプリを検索" aria-label="アプリを検索"></div>
  </div>

  <main class="grid" id="grid"></main>

  <footer>
    カードを増やすときは <code>apps.js</code> に1件足すだけです（表示名・説明・公開URL・絵文字・タグ）。<br>
    このページはGitHub Pagesに置いてあるので、PCのファイルが消えても失われません。スマホからも同じURLで開けます。
  </footer>

</div>

<script src="apps.js"></script>
<script>
(function(){
  'use strict';
  var grid = document.getElementById('grid');
  var chipsEl = document.getElementById('chips');
  var q = document.getElementById('q');
  var filter = 'すべて';
  var query = '';

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  var tags = ['すべて'];
  APPS.forEach(function(a){ if (tags.indexOf(a.tag) === -1) tags.push(a.tag); });

  function renderChips(){
    chipsEl.innerHTML = tags.map(function(t){
      return '<button class="chip' + (t === filter ? ' on' : '') + '" data-t="' + esc(t) + '">' + esc(t) + '</button>';
    }).join('');
  }

  function visible(a){
    if (filter !== 'すべて' && a.tag !== filter) return false;
    if (!query) return true;
    return (a.name + ' ' + a.desc + ' ' + a.tag).toLowerCase().indexOf(query) !== -1;
  }

  function render(){
    var list = APPS.filter(visible);
    if (!list.length){
      grid.innerHTML = '<div class="empty">該当するアプリはありません。</div>';
      return;
    }
    grid.innerHTML = list.map(function(a){
      return '<a class="card" href="' + esc(a.url) + '" target="_blank" rel="noopener">'
        + '<span class="glow" aria-hidden="true"></span>'
        + '<span class="face">'
        +   '<span class="go" aria-hidden="true">↗</span>'
        +   '<span class="inner">'
        +     '<span class="ico" aria-hidden="true">' + esc(a.icon || '📦') + '</span>'
        +     '<span class="cbody">'
        +       '<span class="name">' + esc(a.name) + '</span>'
        +       '<span class="desc">' + esc(a.desc) + '</span>'
        +       '<span class="tag">' + esc(a.tag) + '</span>'
        +     '</span>'
        +   '</span>'
        + '</span></a>';
    }).join('');
  }

  chipsEl.addEventListener('click', function(e){
    var t = e.target.getAttribute('data-t');
    if (!t) return;
    filter = t;
    renderChips(); render();
  });
  q.addEventListener('input', function(){
    query = this.value.trim().toLowerCase();
    render();
  });

  renderChips();
  render();
})();
</script>
</body>
</html>
